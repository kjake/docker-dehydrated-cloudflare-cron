name: Dependabot auto-merge

# Merges Dependabot's grouped action bumps without manual approval.
#
# Safety here rests entirely on the "build" check from build-check.yml being a
# required status check on main. Without it, "gh pr merge --auto" finds the
# pull request immediately mergeable and merges on the spot, unreviewed and
# unbuilt. With it, a bump that breaks the image blocks its own merge.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Workflows triggered by Dependabot get a read-only token by default, which
    # the permissions block above lifts.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
