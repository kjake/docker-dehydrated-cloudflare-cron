# This workflow checks out code, builds an image, performs a container image
# vulnerability scan with Anchore's Grype tool, and integrates the results with GitHub Advanced Security
# code scanning feature.  For more information on the Anchore scan action usage
# and parameters, see https://github.com/anchore/scan-action. For more
# information on Anchore's container image scanning tool Grype, see
# https://github.com/anchore/grype
name: Anchore Container Scan

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '24 5 * * 4'

# The repository default is already write, so this is least-privilege hygiene
# rather than a fix. security-events: write is what the SARIF upload needs.
permissions:
  contents: read
  security-events: write

jobs:
  Anchore-Build-Scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: build local container
      uses: docker/build-push-action@v7
      with:
        tags: localbuild/testimage:latest
        push: false
        load: true
    - name: Scan image
      id: scan
      uses: anchore/scan-action@v7
      with:
        image: "localbuild/testimage:latest"
        output-format: sarif
        fail-build: false
        severity-cutoff: critical
        only-fixed: true
    # Take the report path from the action's own output rather than assuming a
    # filename. scan-action stopped writing "results.sarif" at the workspace
    # root at some point inside the v3 tag, which is what broke this step from
    # 2026-04 onward: the scan kept succeeding and the upload kept failing with
    # "Path does not exist: results.sarif".
    - name: Upload Anchore Scan Report
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
